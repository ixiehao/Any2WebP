name: Feature request
description: Suggest an improvement for Any2WebP.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to do, and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed improvement
      description: Describe what you would expect to happen.
    validations:
      required: true
