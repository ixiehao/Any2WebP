[package]
name = "any2webp"
version = "0.2.32"
edition = "2021"
description = "Local WebP and GIF conversion for macOS"
repository = "https://github.com/ixiehao/Any2WebP"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSAttributedString", "NSColor", "NSFont", "NSParagraphStyle", "NSResponder", "NSText", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAttributedString", "NSDictionary", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
